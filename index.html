<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Management System</h1>

        <div class="form-box">
            <h2>Add Student</h2>

            <input type="text" id="name" placeholder="Student Name">
            <input type="text" id="roll" placeholder="Roll Number">
            <input type="text" id="course" placeholder="Course">
            <input type="number" id="marks" placeholder="Marks">
            <input type="number" id="attendance" placeholder="Attendance %">

            <button onclick="addStudent()">Add Student</button>
        </div>

        <div class="search-box">
            <input type="text" id="search" placeholder="Search student..." onkeyup="searchStudent()">
        </div>

        <h2>Student List</h2>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Roll No</th>
                    <th>Course</th>
                    <th>Marks</th>
                    <th>Attendance</th>
                    <th>Grade</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentTable"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
